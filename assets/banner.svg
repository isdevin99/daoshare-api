      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
